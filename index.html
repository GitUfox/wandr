<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wandr — Make it your trip</title>
    <meta name="description" content="AI-powered travel planning. Personalised itineraries, local picks, photo spots." />

    <!-- Installable PWA: manifest + icons. theme-color matches T.bg0 so the
         status bar and splash don't flash white against the dark theme. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d0d0d" />
    <!-- w-dot mark: SVG adapts to the browser's light/dark tab strip; PNGs are
         the fallback for browsers that don't take SVG favicons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wandr" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Editorial Pass faces (2026-09-02, board picks 1B+2A+3B+4A): Instrument
         Serif (hero), Young Serif (day headers) and Martian Mono (times/data)
         ride the existing Google request — 400 weight only, see the WEIGHT
         RULE in constants.js. Manrope stays the UI base (pick 4A). -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Instrument+Serif&family=Martian+Mono&family=Young+Serif&display=swap" rel="stylesheet" />
    <!-- Erode (itinerary prose) isn't on Google Fonts — self-hosted from
         Fontshare's free build (ITF-FFL, see /fonts/LICENSES.txt). 500 is the
         screen weight; 600 exists for print bold and loads on demand. -->
    <link rel="preload" href="/fonts/erode-500.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: "Erode"; src: url("/fonts/erode-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
      @font-face { font-family: "Erode"; src: url("/fonts/erode-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
