<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tripin — Make it your trip</title>
    <meta name="description" content="AI-powered travel planning. Personalised itineraries, local picks, photo spots." />

    <!-- Installable PWA: manifest + icons. theme-color matches T.bg0 (the light
         Transit Diagram ground) so the status bar and splash match the app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F7F7F2" />
    <!-- Tripin mark (SVG). The PNG fallbacks still hold the old mark until the
         PWA icon step of the redesign. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tripin" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Transit Diagram (2026-11-20): one family, Figtree, as a variable
         weight range. Every type role in constants.js resolves to it. -->
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
